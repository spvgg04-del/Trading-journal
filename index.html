<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prime Journal">
<meta name="theme-color" content="#0F131C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 26 26%22%3E%3Crect width=%2226%22 height=%2226%22 rx=%227%22 fill=%22%232F54EB%22/%3E%3Cpath d=%22M7 17l4-5 3 3 5-7%22 stroke=%22white%22 stroke-width=%222.2%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<title>Prime Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dunkle Seitenleiste links (oben auf dem Handy), rechts ein Raster aus Karten. Zahlen in Mono, P&L immer grün/rot. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EDF0F5; --line:#DFE3EA; --fg:#121722; --muted:#5D6677; --faint:#8A92A3;
  --accent:#2F54EB; --accent-soft:rgba(47,84,235,.10); --on-accent:#FFFFFF;
  --pos:#0E9466; --pos-soft:rgba(14,148,102,.12); --neg:#DC3F45; --neg-soft:rgba(220,63,69,.11); --warn:#B7791F;
  --side:#0F131C; --side-fg:#AEB5C4; --side-hi:#FFFFFF; --side-act:#1D2433;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E14; --surface:#141922; --surface2:#1B212D; --line:#252D3B; --fg:#E6E9F0; --muted:#97A0B2; --faint:#6C7588;
  --accent:#7090FF; --accent-soft:rgba(112,144,255,.14); --on-accent:#0B0E14;
  --pos:#2FC48C; --pos-soft:rgba(47,196,140,.13); --neg:#FF6B70; --neg-soft:rgba(255,107,112,.13); --warn:#E8B04B;
  --side:#080A0F; --side-fg:#9AA2B3; --side-hi:#FFFFFF; --side-act:#171C27;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E14; --surface:#141922; --surface2:#1B212D; --line:#252D3B; --fg:#E6E9F0; --muted:#97A0B2; --faint:#6C7588;
  --accent:#7090FF; --accent-soft:rgba(112,144,255,.14); --on-accent:#0B0E14;
  --pos:#2FC48C; --pos-soft:rgba(47,196,140,.13); --neg:#FF6B70; --neg-soft:rgba(255,107,112,.13); --warn:#E8B04B;
  --side:#080A0F; --side-fg:#9AA2B3; --side-hi:#FFFFFF; --side-act:#171C27;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .faint{color:var(--faint)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-hi);font-weight:800;font-size:16px;letter-spacing:-.01em;padding:4px 10px 18px}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap}
.nav a:hover{color:var(--side-hi);background:var(--side-act)}
.nav a[aria-current="page"]{color:var(--side-hi);background:var(--side-act);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.side .grow{flex:1}
.side .status{font-size:12px;padding:10px;color:var(--side-fg);line-height:1.4}
.main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-inline:clamp(0px,1.5vw,16px)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.topbar h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));gap:6px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--side)}
  .brand{padding:4px 6px 4px 0}.brand span{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;min-width:0}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 10px}
  .nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .side .grow,.side .status{display:none}
}

/* Controls */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:var(--neg-soft)}
.btn.danger.solid{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0;width:100%}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

/* Cards */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-3{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.4fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.g-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g-3>.span-all{grid-column:1/-1}}
@media (max-width:760px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3,.g-2,.g-21{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .hint{font-weight:500;color:var(--faint);font-size:12px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.kpi .val{font-size:22px;font-weight:600}
.kpi .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.long{background:var(--pos-soft);color:var(--pos)} .pill.short{background:var(--neg-soft);color:var(--neg)}
.pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.warn{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.mis[aria-pressed="true"]{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--faint);font-family:var(--f-num);font-size:10.5px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:28px 12px;color:var(--muted);font-size:13px}
.empty b{color:var(--fg);font-size:14px}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.barcell{position:relative;min-width:120px}
.barcell i{position:absolute;top:50%;height:8px;transform:translateY(-50%);border-radius:2px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.05fr);gap:6px}
.cal .dow{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:2px 0}
.cal .cell{min-height:92px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:2px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.cal .cell.out{opacity:.35;cursor:default}
.cal .cell .d{font-size:12px;font-weight:700;color:var(--muted)}
.cal .cell .p{font-family:var(--f-num);font-weight:600;font-size:13px;margin-top:auto;overflow:hidden;text-overflow:ellipsis}
.cal .cell .t{font-size:11px;color:var(--muted)}
.cal .cell.win{background:var(--pos-soft);border-color:color-mix(in srgb,var(--pos) 40%,transparent)}
.cal .cell.loss{background:var(--neg-soft);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.cal .cell.note::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);position:absolute}
.cal .cell{position:relative}
.cal .cell.note::after{top:8px;right:8px}
.cal .wk{border-radius:8px;background:var(--surface2);padding:7px 8px;display:flex;flex-direction:column;gap:2px;min-height:92px;justify-content:center;min-width:0}
.cal .wk .d{font-size:11px;font-weight:700;color:var(--faint)}
.cal .wk .p{font-family:var(--f-num);font-weight:700;font-size:13px}
.cal.mini .cell,.cal.mini .wk{min-height:54px;padding:5px 6px}
.cal.mini .cell .t{display:none}
.cal.mini .cell .p,.cal.mini .wk .p{font-size:11px}
@media (max-width:760px){.cal{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.cal .wk,.cal .wkh{display:none}.cal .cell{min-height:58px;padding:4px}.cal .cell .t{display:none}.cal .cell .p{font-size:10px}}

/* Journal day */
.day{display:flex;flex-direction:column;gap:14px}
.dayhead{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:space-between}
.dayhead h2{margin:0;font-size:16px;font-weight:800}
.daystats{display:flex;flex-wrap:wrap;gap:6px 22px}
.daystats div{display:flex;flex-direction:column;font-size:11px;color:var(--muted);font-weight:600}
.daystats b{font-family:var(--f-num);font-size:14px;color:var(--fg);font-weight:600}
.daybody{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px}
@media (max-width:760px){.daybody{grid-template-columns:minmax(0,1fr)}}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,10,16,.55);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(980px,100%);height:100%;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.dhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.dhead h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.statlist{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:13px}
.statlist dt{color:var(--muted)} .statlist dd{margin:0;text-align:right;font-family:var(--f-num)}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:2px;cursor:pointer;color:var(--line);font-size:20px;line-height:1}
.stars button.on{color:var(--warn)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shot{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);aspect-ratio:16/10;max-width:100%}
.shot img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.shot button{position:absolute;top:6px;right:6px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.rule{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px;cursor:pointer}
.rule input{margin-top:3px;accent-color:var(--accent)}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:13px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pbcard{cursor:pointer;display:flex;flex-direction:column;gap:12px;text-align:left}
.pbcard:hover{border-color:var(--faint)}
.pbdot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.minigrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.minigrid div{display:flex;flex-direction:column;font-size:11px;color:var(--muted);font-weight:600;gap:2px}
.minigrid b{font-family:var(--f-num);font-size:14px;color:var(--fg);font-weight:600}
.score{display:flex;align-items:center;gap:14px}
.score .big{font-size:34px;font-weight:700;font-family:var(--f-num)}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:5px}
.steps code,.code{font-family:var(--f-num);font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:4px;color:var(--fg)}
.sep{height:1px;background:var(--line);margin:4px 0}
.idot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;background:var(--faint)}
.idot.h{background:var(--neg)} .idot.m{background:#E8892B} .idot.l{background:#D9B93A}
.newsday{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.newsday:first-of-type{border-top:0;padding-top:0}
.newsday .nd{font-weight:700;font-size:13px}
.newsday.today .nd{color:var(--accent)}
.tbl tr.past td{opacity:.5}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.hint.btn{font-weight:500;color:var(--faint);padding:0;border:0;background:none;text-decoration:underline}
.ainotes{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.ainote{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.ainote:first-of-type{border-top:0;padding-top:0}
.md{font-size:13.5px;line-height:1.6;min-width:0}
.md h2{font-size:18px}.md h3{font-size:15px;margin:14px 0 6px;display:block}.md h4{font-size:13.5px;margin:12px 0 4px}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:20px}
.md .tbl td,.md .tbl th{white-space:normal}
.report{max-width:900px}
.repitem{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer}
.repitem:hover{background:var(--surface2)}
.repitem[aria-pressed="true"]{background:var(--accent-soft)}
@media (max-width:760px){.grid[style*="280px"]{grid-template-columns:minmax(0,1fr)!important}}
.newnote{position:relative}
.newnote .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:220px}
.newnote .menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
.newnote .menu button:hover{background:var(--surface2)}
.nb{display:grid;grid-template-columns:240px 300px minmax(0,1fr);gap:14px;align-items:start}
.nb-folders{padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.nb-f,.nb-i{border:0;background:none;text-align:left;border-radius:8px;cursor:pointer;color:inherit}
.nb-f{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font-weight:600;font-size:13px;min-width:0}
.nb-f span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nb-f:hover,.nb-i:hover{background:var(--surface2)}
.nb-f[aria-pressed="true"],.nb-i[aria-pressed="true"]{background:var(--accent-soft)}
.nb-list{padding:10px;display:flex;flex-direction:column;gap:8px}
.nb-items{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 210px);overflow-y:auto}
.nb-i{display:flex;flex-direction:column;gap:2px;padding:9px 10px}
.nb-snip{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb-edit{min-height:60vh;display:flex;flex-direction:column}
.nb-head{display:flex;flex-direction:column;gap:8px}
.nb-title{font-size:18px;font-weight:700;border-color:transparent;padding-left:4px}
.nb-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nb-tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:10px;position:sticky;top:0;background:var(--surface);z-index:2}

.md h2,.nb-body h2{font-size:17px;margin:18px 0 6px}.md h3,.nb-body h3{font-size:14.5px;margin:14px 0 4px}
.nb-back{display:none}
@media (max-width:1180px){.nb{grid-template-columns:220px minmax(0,1fr)}.nb-edit{grid-column:1/-1}.nb.has-open .nb-list,.nb.has-open .nb-folders{display:none}.nb.has-open .nb-edit{grid-column:1/-1}.nb-back{display:inline-flex;align-self:flex-start}}
@media (max-width:700px){.nb{grid-template-columns:minmax(0,1fr)}.nb-folders{position:static;flex-direction:row;overflow-x:auto}.nb-folders .sep,.nb-folders>div:last-child{display:none}.nb-f{white-space:nowrap}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modal"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ========= Speicher: Supabase (Cloud) oder lokal im Browser ========= */
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const IDB = {
  db: null,
  open() { if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const r = indexedDB.open("prime-journal", 1); r.onupgradeneeded = () => r.result.createObjectStore("shots"); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }); },
  async op(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction("shots", mode); const r = fn(tx.objectStore("shots")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); },
  put(k, v) { return this.op("readwrite", s => s.put(v, k)); }, get(k) { return this.op("readonly", s => s.get(k)); }, del(k) { return this.op("readwrite", s => s.delete(k)); }
};
const Store = {
  mode: "local", sb: null, uid: null, email: "", urls: {},
  local: null, localT: null,
  cfg() { const c = window.PJ_CONFIG || {}; return { url: (c.supabaseUrl || lsGet("pj-sb-url") || "").trim(), key: (c.supabaseKey || lsGet("pj-sb-key") || "").trim(), fromFile: !!(c.supabaseUrl && c.supabaseKey) }; },
  init() {
    const { url, key } = this.cfg();
    if (url && key && window.supabase && window.supabase.createClient) {
      try { this.sb = window.supabase.createClient(url, key); this.mode = "cloud"; } catch (e) { this.mode = "local"; }
    }
  },
  async session() { const { data } = await this.sb.auth.getSession(); const u = data.session && data.session.user; this.uid = u ? u.id : null; this.email = u ? u.email : ""; return this.uid; },
  async signIn(email, pw) { const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pw }); if (error) throw error; this.uid = data.user.id; this.email = data.user.email; },
  async signUp(email, pw) { const { data, error } = await this.sb.auth.signUp({ email, password: pw }); if (error) throw error; return !!data.session; },
  async signOut() { if (this.sb) await this.sb.auth.signOut(); this.uid = null; },
  localData() { if (!this.local) { try { this.local = JSON.parse(lsGet("pj-local") || "{}"); } catch (e) { this.local = {}; } } return this.local; },
  saveLocal() { clearTimeout(this.localT); this.localT = setTimeout(() => { if (!lsSet("pj-local", JSON.stringify(this.local))) toast("Lokaler Speicher ist voll. Richte die Cloud-Datenbank ein oder exportiere eine Sicherung."); }, 250); },
  async loadAll() {
    if (this.mode === "cloud") {
      const rows = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await this.sb.from("docs").select("col,id,data").range(from, from + 999);
        if (error) throw error; rows.push(...data); if (data.length < 1000) break;
      }
      return rows;
    }
    const o = this.localData();
    return Object.entries(o).map(([k, v]) => { const i = k.indexOf("/"); return { col: k.slice(0, i), id: k.slice(i + 1), data: v }; });
  },
  async setMany(col, items) { // items: [{id, data}]
    if (!items.length) return;
    if (this.mode === "cloud") {
      const now = new Date().toISOString();
      for (let i = 0; i < items.length; i += 200) {
        const { error } = await this.sb.from("docs").upsert(items.slice(i, i + 200).map(x => ({ user_id: this.uid, col, id: x.id, data: x.data, updated_at: now })));
        if (error) throw error;
      }
    } else { const o = this.localData(); items.forEach(x => o[col + "/" + x.id] = x.data); this.saveLocal(); }
  },
  set(col, id, data) { return this.setMany(col, [{ id, data }]); },
  async delMany(col, ids) {
    if (!ids.length) return;
    if (this.mode === "cloud") { for (let i = 0; i < ids.length; i += 200) { const { error } = await this.sb.from("docs").delete().eq("col", col).in("id", ids.slice(i, i + 200)); if (error) throw error; } }
    else { const o = this.localData(); ids.forEach(id => delete o[col + "/" + id]); this.saveLocal(); }
  },
  del(col, id) { return this.delMany(col, [id]); },
  async shrink(file) {
    try {
      const bmp = await createImageBitmap(file); const max = 1920, sc = Math.min(1, max / bmp.width);
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.88));
    } catch (e) { return file; }
  },
  async upload(file) {
    const blob = await this.shrink(file); const name = rid() + ".jpg";
    if (this.mode === "cloud") {
      const path = this.uid + "/" + name;
      const { error } = await this.sb.storage.from("shots").upload(path, blob, { contentType: "image/jpeg", upsert: false });
      if (error) throw error; return path;
    }
    await IDB.put(name, blob); return "local:" + name;
  },
  async url(id) {
    if (this.urls[id]) return this.urls[id];
    let u = null;
    if (id.startsWith("local:")) { const b = await IDB.get(id.slice(6)); if (b) u = URL.createObjectURL(b); }
    else if (this.mode === "cloud") { const { data } = await this.sb.storage.from("shots").createSignedUrl(id, 60 * 60 * 24); u = data && data.signedUrl; }
    if (u) this.urls[id] = u; return u;
  },
  async removeShot(id) {
    try { if (id.startsWith("local:")) await IDB.del(id.slice(6)); else if (this.mode === "cloud") await this.sb.storage.from("shots").remove([id]); } catch (e) { }
  }
};
async function hydrateShots() {
  for (const img of document.querySelectorAll("img[data-shot]")) {
    if (img.getAttribute("src")) continue;
    const id = img.dataset.shot;
    if (Store.urls[id]) { img.src = Store.urls[id]; continue; }
    Store.url(id).then(u => { if (u) img.src = u; else img.alt = "Bild nicht gefunden"; }).catch(() => { img.alt = "Bild nicht geladen"; });
  }
}
function downloadFile(filename, data, type) {
  const blob = new Blob([data], { type: type || "text/plain;charset=utf-8" }); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ========= Einheiten: Geld, R, Pips ========= */
const pipSize = sym => { const s = String(sym || "").toUpperCase().replace(/[^A-Z]/g, ""); if (/^[A-Z]{6}$/.test(s)) return s.endsWith("JPY") ? 0.01 : 0.0001; return 1; };
const pipsOf = t => t.entry != null && t.exit != null ? (t.exit - t.entry) * (t.side === "long" ? 1 : -1) / pipSize(t.symbol) : null;
const riskPrice = t => t.sl != null && t.entry != null && Math.abs(t.entry - t.sl) > 0 ? Math.abs(t.entry - t.sl) : null;
const Rof = t => { if (t.risk > 0) return t.net / t.risk; const rp = riskPrice(t); return rp && t.exit != null ? (t.exit - t.entry) * (t.side === "long" ? 1 : -1) / rp : null; };
const crvOf = t => { const rp = riskPrice(t); return rp && t.tp != null ? Math.abs(t.tp - t.entry) / rp : null; };
const V = t => S.unit === "R" ? Rof(t) : S.unit === "pips" ? pipsOf(t) : t.net;
function fmtV(v, o = {}) {
  if (v == null || isNaN(v)) return "–";
  const sg = o.sign && v > 0 ? "+" : "";
  if (S.unit === "R") return sg + fmtNum(v, 2) + " R";
  if (S.unit === "pips") return sg + fmtNum(v, 1) + " Pips";
  return fmtMoney(v, o);
}

/* ========= Sessions ========= */
const hm = s => { const [h, m] = String(s || "0:0").split(":").map(Number); return (h || 0) + (m || 0) / 60; };
function sessionOf(t) {
  const s = t.openTime || ""; if (s.length < 16) return "(unbekannt)";
  const st = S.settings; let x;
  try { const p = new Intl.DateTimeFormat("en-GB", { timeZone: st.sessTZ || "Europe/London", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(toDate(s)); x = +p.find(q => q.type === "hour").value + (+p.find(q => q.type === "minute").value) / 60; }
  catch (e) { x = hm(s.slice(11, 16)); }
  if (x < hm(st.lonOpen || "08:00")) return "Asien"; if (x < hm(st.ovOpen || "13:30")) return "London"; if (x < hm(st.nyOpen || "16:30")) return "London/NY"; return "New York";
}
const SESSIONS = ["Asien", "London", "London/NY", "New York", "(unbekannt)"];

/* ========= News GBP/JPY ========= */
const NEWS_URL = "https://nfs.faireconomy.media/ff_calendar_thisweek.json";
const NEWS_CUR = ["GBP", "JPY"];
const IMPACT = { High: "Hoch", Medium: "Mittel", Low: "Niedrig", Holiday: "Feiertag" };
function localISO(d) { return `${dstr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`; }
function rebuildNews() {
  const all = {}; Object.values(S.newsWeeks).forEach(w => (w.events || []).forEach(e => { all[e.t + "|" + e.cur + "|" + e.title] = e; }));
  S.news = Object.values(all).sort((a, b) => a.t.localeCompare(b.t));
}
async function ensureNews(force) {
  let cache = null; try { cache = JSON.parse(lsGet("pj-news") || "null"); } catch (e) { }
  if (!force && cache && Date.now() - cache.at < 2 * 3600 * 1000) { S.newsAt = cache.at; return; }
  try {
    const r = await fetch(NEWS_URL, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status);
    const raw = await r.json();
    const events = raw.filter(e => NEWS_CUR.includes(e.country)).map(e => { const d = new Date(e.date); return { t: localISO(d), cur: e.country, title: e.title, impact: e.impact, forecast: e.forecast || "", previous: e.previous || "", actual: e.actual || "" }; });
    const dates = raw.map(e => new Date(e.date)).filter(d => !isNaN(d)).sort((a, b) => a - b);
    if (!dates.length) throw new Error("leer");
    const from = new Date(dates[0]); from.setHours(0, 0, 0, 0); while (from.getDay() !== 0) from.setDate(from.getDate() - 1);
    const to = new Date(from); to.setDate(to.getDate() + 6); if (dates[dates.length - 1] > to) to.setTime(dates[dates.length - 1].getTime());
    const wk = { from: dstr(from), to: dstr(to), events, fetched: new Date().toISOString() };
    S.newsWeeks[wk.from] = wk; rebuildNews(); S.newsErr = false; S.newsAt = Date.now();
    lsSet("pj-news", JSON.stringify({ at: S.newsAt }));
    Store.set("news", wk.from, wk).catch(() => { });
  } catch (e) { S.newsErr = true; }
  renderSoft();
}
const newsCovered = date => Object.values(S.newsWeeks).some(w => date >= w.from && date <= w.to);
const newsOn = (date, lvl = "hm") => S.news.filter(e => e.t.startsWith(date) && impactOk(e, lvl));
const impactOk = (e, lvl) => lvl === "all" ? true : lvl === "h" ? e.impact === "High" : (e.impact === "High" || e.impact === "Medium");
function newsDay(date) { if (!newsCovered(date)) return "Keine News-Daten"; return newsOn(date, "h").length ? "High-Impact-Tag" : "Ohne High-Impact"; }
function newsHits(t) {
  if (!t.openTime || !t.closeTime) return [];
  const a = new Date(toDate(t.openTime).getTime() - 30 * 60000), b = new Date(toDate(t.closeTime).getTime() + 5 * 60000);
  return S.news.filter(e => e.impact === "High" && toDate(e.t) >= a && toDate(e.t) <= b);
}
function newsWindowLabel(t) { const d = t.date; if (!newsCovered(d)) return "Keine News-Daten"; return newsHits(t).length ? "Im News-Fenster" : "Außerhalb"; }
const impactDot = imp => `<span class="idot ${imp === "High" ? "h" : imp === "Medium" ? "m" : imp === "Low" ? "l" : "x"}" title="${esc(IMPACT[imp] || imp)}"></span>`;
function isoWeek(s) { const d = parseD(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 86400000 + 1) / 7); }
const mondayOf = s => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dstr(d); };
"use strict";
/* ========= Helpers ========= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const WD_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const DEFAULT_SETTINGS = {
  currency: "EUR", startBalance: 0, tzShift: 0,
  tags: ["London", "New York", "Asien", "Trendtag", "Rangetag", "Nach News", "A+ Setup"],
  mistakes: ["FOMO", "Zu früh eingestiegen", "SL verschoben", "Zu früh geschlossen", "Revenge-Trade", "Overtrading", "Gegen Plan", "Kein Setup", "Position zu groß", "News ignoriert"],
  moods: ["Fokussiert", "Ruhig", "Neutral", "Ungeduldig", "Gestresst", "Müde"],
  maxTrades: 3, maxLoss: 0, lonOpen: "08:00", ovOpen: "13:30", nyOpen: "16:30", sessTZ: "Europe/London",
  weekQuestions: ["Was lief diese Woche gut?", "Welche Fehler haben sich wiederholt?", "Habe ich meine Regeln und Limits eingehalten?", "Mein Fokus für nächste Woche:"]
};
const S = {
  trades: [], playbooks: [], days: {}, settings: { ...DEFAULT_SETTINGS },
  loaded: false, slow: false, dbState: "connecting",
  view: "dashboard", range: "all", from: "", to: "",
  calMonth: null, journalDay: null, journalLimit: 10,
  tf: { q: "", side: "", result: "", pb: "", tag: "", mis: "" }, tsort: { k: "close", d: -1 },
  openTrade: null, confirmDel: null, pbOpen: null, pbEdit: null, reportDim: "session",
  importPrev: null, lightbox: null, busy: null,
  unit: "eur", auth: null, authMsg: "", news: [], newsWeeks: {}, newsErr: false, newsAt: 0, newsFilter: "hm", jmode: "days", weeks: {}, reports: [], strategy: "", mcp: null, reportOpen: null, notes: [], noteFolder: null, noteOpen: null, noteQ: "", noteMenu: false
};

const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => dstr(new Date());
const parseD = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const wdIdx = s => (parseD(s).getDay() + 6) % 7;
const fmtDate = s => { if (!s) return "–"; const d = parseD(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
const fmtDateLong = s => { const d = parseD(s); return `${WD_LONG[wdIdx(s)]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtTime = s => s && s.length > 11 ? s.slice(11, 16) : "";
const toDate = s => s ? new Date(s.length === 10 ? s + "T00:00:00" : s) : null;
function fmtMoney(n, opts = {}) {
  if (n == null || isNaN(n)) return "–";
  const cur = opts.cur || S.settings.currency || "EUR";
  const s = new Intl.NumberFormat("de-DE", { style: "currency", currency: cur, minimumFractionDigits: opts.dec ?? 2, maximumFractionDigits: opts.dec ?? 2 }).format(n);
  return opts.sign && n > 0 ? "+" + s : s;
}
const fmtNum = (n, d = 2) => n == null || isNaN(n) ? "–" : new Intl.NumberFormat("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
const fmtPrice = n => n == null || isNaN(n) ? "–" : new Intl.NumberFormat("de-DE", { maximumFractionDigits: 5 }).format(n);
const fmtPct = (n, d = 1) => n == null || isNaN(n) ? "–" : fmtNum(n * 100, d) + " %";
const fmtCompact = n => new Intl.NumberFormat("de-DE", { notation: "compact", maximumFractionDigits: 1 }).format(n);
const fmtPF = n => n === Infinity ? "∞" : fmtNum(n, 2);
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";
function fmtDur(min) {
  if (min == null || isNaN(min)) return "–";
  if (min < 1) return "< 1 Min";
  if (min < 60) return Math.round(min) + " Min";
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  if (h < 24) return `${h} Std ${m} Min`;
  return `${Math.floor(h / 24)} T ${h % 24} Std`;
}
const holdMin = t => { const a = toDate(t.openTime), b = toDate(t.closeTime); return a && b ? (b - a) / 60000 : null; };
function hashStr(s) { let h1 = 0x811c9dc5, h2 = 0x1b873593; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822507); } return (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0"); }

/* ========= Range filter ========= */
function rangeBounds() {
  const t = new Date(); const r = S.range;
  if (r === "all") return [null, null];
  if (r === "custom") return [S.from || null, S.to || null];
  if (r === "week") { const d = new Date(t); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [dstr(d), null]; }
  if (r === "month") return [`${t.getFullYear()}-${pad(t.getMonth() + 1)}-01`, null];
  if (r === "ytd") return [`${t.getFullYear()}-01-01`, null];
  const days = +r; const d = new Date(t); d.setDate(d.getDate() - days + 1); return [dstr(d), null];
}
const inRange = (date, [a, b]) => (!a || date >= a) && (!b || date <= b);
const rangedTrades = () => { const b = rangeBounds(); return S.trades.filter(t => inRange(t.date, b)); };
const RANGES = [["all", "Alle"], ["week", "Woche"], ["month", "Monat"], ["30", "30 T"], ["90", "90 T"], ["ytd", "Jahr"], ["custom", "Zeitraum"]];
function rangeControl() {
  return `<div class="seg" role="group" aria-label="Zeitraum">${RANGES.map(([k, l]) => `<button data-act="range" data-v="${k}" aria-pressed="${S.range === k}">${l}</button>`).join("")}</div>
  <div class="seg" role="group" aria-label="Einheit">${[["eur", S.settings.currency === "USD" ? "$" : "€"], ["R", "R"], ["pips", "Pips"]].map(([k, l]) => `<button data-act="unit" data-v="${k}" aria-pressed="${S.unit === k}">${l}</button>`).join("")}</div>
  ${S.range === "custom" ? `<input type="date" class="inp" style="width:auto" id="r-from" data-ch="rfrom" value="${esc(S.from)}"><input type="date" class="inp" style="width:auto" id="r-to" data-ch="rto" value="${esc(S.to)}">` : ""}`;
}

/* ========= Stats ========= */
const byClose = (a, b) => (a.closeTime || "").localeCompare(b.closeTime || "");
function stats(ts) {
  const st = { n: ts.length, net: 0, gross: 0, fees: 0, w: 0, l: 0, be: 0, gw: 0, gl: 0, maxDD: 0, bestT: null, worstT: null, daily: {}, rSum: 0, rN: 0, holdW: 0, holdL: 0 };
  let hw = 0, hl = 0;
  const sorted = ts.filter(t => V(t) != null).sort(byClose); st.n = sorted.length;
  let eq = 0, peak = 0;
  st.curve = [];
  for (const t of sorted) {
    const n = +V(t) || 0;

    symbol: c.sym, asset: p0.asset || "", side: c.side, qty: oq, mult,

function buildImport(text, name) {
  const base = (S.settings.currency || "EUR").toUpperCase();
  const { execs, skipped } = parseIB(text, +S.settings.tzShift || 0);
  const known = new Set(); S.trades.forEach(t => (t.execKeys || []).forEach(k => known.add(k)));
  const fresh = execs.filter(e => !known.has(e.key));
  const grp = groupExecs(fresh, base); const openExecs = grp.openExecs;
  const old = S.trades.filter(t => !(t.execKeys || []).length && !t.demo);
  const same = (a, b) => a.side === b.side && (String(a.openTime || "").slice(0, 16) === String(b.openTime || "").slice(0, 16) || (a.date === b.date && a.entry != null && Math.abs(a.entry - b.entry) < 0.02 && Math.abs((a.qty || 0) - (b.qty || 0)) < 1e-6));
  let dupT = 0; const trades = grp.trades.filter(x => { if (old.some(t => same(t, x))) { dupT += x.execKeys.length; return false; } return true; });
  trades.sort(byClose);
  return { name, execs: execs.length, dup: execs.length - fresh.length + dupT, skipped, trades, openExecs, fx: trades.filter(t => t.fxMissing).length };
}

/* ========= Demo data ========= */
function demoTrades() {
  const out = []; const syms = [["GBP.JPY", 0.01, 100000, "CASH", 198]];
  const pbs = S.playbooks.map(p => p.id); const today = new Date(); let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let back = 60; back >= 1; back--) {
    const d = new Date(today); d.setDate(d.getDate() - back); if (d.getDay() === 0 || d.getDay() === 6) continue;
    const n = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) {
      const [sym, tick, qty, asset, px] = syms[Math.floor(rnd() * syms.length)];
      const side = rnd() > 0.45 ? "long" : "short";
      const london = rnd() > 0.4, h = london ? 9 + Math.floor(rnd() * 2) : 15 + Math.floor(rnd() * 2), mi = Math.floor(rnd() * 60);
      const open = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, mi), dur = 4 + Math.floor(rnd() * 80);
      const close = new Date(open.getTime() + dur * 60000);
      const win = rnd() < 0.52, risk = 150 + Math.round(rnd() * 100);
      const r = win ? 0.8 + rnd() * 1.6 : -(0.4 + rnd() * 0.65);
      const fees = 3.1, net = +(risk * r).toFixed(2);
      const ts = x => `${dstr(x)}T${pad(x.getHours())}:${pad(x.getMinutes())}:00`;
      const mis = !win && rnd() < 0.5 ? [S.settings.mistakes[Math.floor(rnd() * 5)]] : [];
      const qual = win ? (rnd() < 0.6 ? "A" : "B") : (rnd() < 0.5 ? "C" : "B");
      const pb = pbs.length ? pbs[Math.floor(rnd() * pbs.length)] : "";
      const P = getPb(pb); const fields = {}; (P?.fields || []).forEach(f => { if (/qualit/i.test(f.name)) fields[f.name] = f.options.find(o => o === qual) || f.options[0]; else fields[f.name] = f.options[Math.floor(rnd() * f.options.length)]; });
      const rules = (P?.rules || []).filter(() => rnd() < (win ? 0.85 : 0.55));
      const move = Math.abs(net + fees) / 5.6 * 0.01;
      const entry = px * (1 + (rnd() - 0.5) * 0.02), exit = side === "long" ? entry + Math.sign(net) * move : entry - Math.sign(net) * move;
      out.push({ id: "demo" + rid(), symbol: sym, asset, side, qty, mult: 1, entry: +entry.toFixed(5), exit: +exit.toFixed(5), openTime: ts(open), closeTime: ts(close), date: dstr(close), gross: +(net + fees).toFixed(2), fees, net: +(net).toFixed(2), currency: S.settings.currency, risk, source: "demo", demo: true, tags: [london ? "London" : "New York"], mistakes: mis, rules, fields, notes: "", rating: win ? 4 : 2, playbook: pb, shots: [], execs: [], execKeys: [], created: new Date().toISOString() });
    }
  }
  return out;
}

/* ========= Breakdown helper ========= */
function groupRows(ts, keyFn, order) {
  const g = {};
  for (const t of ts) { let k = keyFn(t); const ks = Array.isArray(k) ? (k.length ? k : ["(keine)"]) : [k ?? "(keine)"]; for (const x of ks) (g[x] = g[x] || []).push(t); }
  let rows = Object.entries(g).map(([k, x]) => ({ k, s: stats(x) }));
  if (order) rows.sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k)); else rows.sort((a, b) => b.s.net - a.s.net);
  return rows;
}
function breakdownTable(rows, label, compact) {

const DIMS = [["session", "Session"], ["weekday", "Wochentag"], ["hour", "Uhrzeit"], ["newsday", "News-Tag"], ["newswin", "News-Fenster"], ["crv", "CRV geplant"], ["rules", "Regeltreue"], ["symbol", "Symbol"], ["side", "Richtung"], ["playbook", "Playbook"], ["tags", "Tags"], ["mistakes", "Fehler"], ["hold", "Haltedauer"], ["rating", "Bewertung"], ["month", "Monat"]];
function dimDef(k) {
  const HB = ["< 5 Min", "5–15 Min", "15–30 Min", "30–60 Min", "1–4 Std", "> 4 Std"];
  switch (k) {
    case "weekday": return [t => WD_LONG[wdIdx(t.date)], WD_LONG];
    case "hour": { const o = Array.from({ length: 24 }, (_, i) => pad(i) + ":00"); return [t => (t.openTime || "").slice(11, 13) + ":00", o]; }
    case "symbol": return [t => t.symbol];
    case "crv": { const B = ["< 1", "1–1,5", "1,5–2", "2–3", "≥ 3", "ohne SL/TP"]; return [t => { const c = crvOf(t); return c == null ? B[5] : c < 1 ? B[0] : c < 1.5 ? B[1] : c < 2 ? B[2] : c < 3 ? B[3] : B[4]; }, B]; }
    case "rules": return [t => { const p = getPb(t.playbook); if (!p || !(p.rules || []).length) return "Ohne Playbook"; const f = (t.rules || []).filter(r => p.rules.includes(r)).length; return f === p.rules.length ? "Alle Regeln erfüllt" : p.rules.length - f === 1 ? "1 Regel verletzt" : "2+ Regeln verletzt"; }, ["Alle Regeln erfüllt", "1 Regel verletzt", "2+ Regeln verletzt", "Ohne Playbook"]];
    case "session": return [sessionOf, SESSIONS];
    case "newsday": return [t => newsDay(t.date), ["High-Impact-Tag", "Ohne High-Impact", "Keine News-Daten"]];
    case "newswin": return [newsWindowLabel, ["Im News-Fenster", "Außerhalb", "Keine News-Daten"]];
    case "side": return [t => t.side === "long" ? "Long" : "Short", ["Long", "Short"]];
    case "playbook": return [t => getPb(t.playbook)?.name || "Ohne Playbook"];
    case "tags": return [t => t.tags || []];
    case "mistakes": return [t => (t.mistakes || []).length ? t.mistakes : ["Keine Fehler"]];
    case "hold": return [t => { const m = holdMin(t); if (m == null) return "(unbekannt)"; return m < 5 ? HB[0] : m < 15 ? HB[1] : m < 30 ? HB[2] : m < 60 ? HB[3] : m < 240 ? HB[4] : HB[5]; }, [...HB, "(unbekannt)"]];
    case "rating": return [t => t.rating ? "★".repeat(t.rating) : "Ohne", ["★", "★★", "★★★", "★★★★", "★★★★★", "Ohne"]];
    case "month": { return [t => t.date.slice(0, 7), [...new Set(S.trades.map(t => t.date.slice(0, 7)))].sort()]; }
  }
  if (k.startsWith("f:")) { const name = k.slice(2); const opts = [...new Set(S.playbooks.flatMap(p => (p.fields || []).filter(f => f.name === name).flatMap(f => f.options)))]; return [t => t.fields?.[name] || "(nicht gesetzt)", [...opts, "(nicht gesetzt)"]]; }
  return [t => "?"];
}
function viewReports() {

/* ========= Limits ========= */
function dayLimits(date) {
  const ts = S.trades.filter(t => t.date === date); const net = ts.reduce((a, t) => a + (+t.net || 0), 0);
  const mt = +S.settings.maxTrades || 0, ml = +S.settings.maxLoss || 0;
  return { n: ts.length, net, overTrades: mt > 0 && ts.length > mt, overLoss: ml > 0 && net <= -ml, mt, ml };
}
const limitHit = d => { const l = dayLimits(d); return l.overTrades || l.overLoss; };
function limitBadges(d) {
  const l = dayLimits(d); let h = "";
  if (l.overTrades) h += ` <span class="pill short">Trade-Limit überschritten (${l.n}/${l.mt})</span>`;
  if (l.overLoss) h += ` <span class="pill short">Tagesverlust-Limit erreicht</span>`;
  return h;
}

/* ========= Wochenrückblick ========= */
function viewWeeks(jseg) {
  const b = rangeBounds();
  const weeks = [...new Set([...S.trades.map(t => mondayOf(t.date)), ...Object.keys(S.weeks), mondayOf(todayStr())])].filter(w => inRange(w, [b[0] ? mondayOf(b[0]) : null, b[1]])).sort().reverse();
  let h = topbar("Tagebuch", `${weeks.length} Wochen`, jseg + rangeControl()) + banners();
  const qs = S.settings.weekQuestions || [];
  h += weeks.slice(0, S.journalLimit).map(w => {
    const end = parseD(w); end.setDate(end.getDate() + 6); const we = dstr(end);
    const ts = S.trades.filter(t => t.date >= w && t.date <= we); const st = stats(ts); const wd = S.weeks[w] || {}; const ans = wd.answers || {};
    const days = Object.keys(st.daily).sort();
    return `<div class="card day"><div class="dayhead"><h2>KW ${isoWeek(w)} · ${fmtDate(w).slice(0, 6)} – ${fmtDate(we)}</h2><div class="num ${cls(st.net)}" style="font-size:18px;font-weight:700">${ts.length ? fmtV(st.net, { sign: 1 }) : ""}</div></div>
     ${ts.length ? `<div class="daystats"><div>Trades<b>${st.n}</b></div><div>Trefferquote<b>${fmtPct(st.winRate, 0)}</b></div><div>Profit-Faktor<b>${fmtPF(st.pf)}</b></div><div>Grüne Tage<b>${st.dw}/${st.days}</b></div><div>Tage über Limit<b>${days.filter(limitHit).length}</b></div><div>Fehler<b>${ts.reduce((a, t) => a + (t.mistakes || []).length, 0)}</b></div></div>` : `<div class="faint">Keine Trades in dieser Woche.</div>`}
     ${weekNotesHTML(w, we)}
     ${aiNotesHTML(wd.aiNotes, "weeks", w)}
     <div class="grid g-2">${qs.map((q, i) => `<label class="f">${esc(q)}<textarea class="inp" id="wq-${w}-${i}" data-ch="weekText" data-w="${w}" data-q="${esc(q)}">${esc(ans[q] || "")}</textarea></label>`).join("")}</div></div>`;
  }).join("");
  if (weeks.length > S.journalLimit) h += `<div style="text-align:center"><button class="btn" data-act="more">Weitere Wochen laden</button></div>`;
  return h;
}

/* ========= KI-Notizen & Berichte ========= */
function mdToHtml(md) {
  const lines = String(md || "").replace(/\r/g, "").split("\n"); let h = "", list = null, tbl = null;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, '<code class="code">$1</code>');
  const flush = () => { if (list) { h += `</${list}>`; list = null; } if (tbl) { h += `<div class="tbl-wrap"><table class="tbl">${tbl.map((r, i) => `<tr>${r.map(c => i ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("")}</tr>`).join("")}</table></div>`; tbl = null; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\s*\|.*\|\s*$/.test(l)) { if (list) { h += `</${list}>`; list = null; } const cells = l.trim().slice(1, -1).split("|").map(c => c.trim()); if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue; (tbl = tbl || []).push(cells); continue; }
    if (tbl) flush();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); const lv = Math.min(4, m[1].length + 1); h += `<h${lv}>${inline(m[2])}</h${lv}>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { flush(); h += "<ul>"; list = "ul"; } h += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { flush(); h += "<ol>"; list = "ol"; } h += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) flush();
    else { flush(); h += `<p>${inline(l)}</p>`; }
  }
  flush(); return h;
}
function aiNotesHTML(list, col, id) {
  if (!list || !list.length) return "";
  return `<div class="card ainotes"><h3><span>${ico("berichte", 15)} KI-Notizen</span><span class="hint">${list.length}</span></h3>${list.map((n, i) => `<div class="ainote"><div class="faint" style="font-size:11px;display:flex;justify-content:space-between;gap:8px"><span>${esc(n.source || "KI")} · ${n.at ? fmtDate(n.at.slice(0, 10)) + " " + n.at.slice(11, 16) : ""}</span><button class="btn ghost sm" data-act="delAiNote" data-col="${col}" data-id="${esc(id)}" data-i="${i}" aria-label="KI-Notiz löschen">${ico("x", 12)}</button></div><div class="md">${mdToHtml(n.text)}</div></div>`).join("")}</div>`;

  const viaImages = S.notes.find(n => (n.images || []).includes(first));
  if (viaImages) return { type: "note", id: viaImages.id };
  const d = it.date || "", dm = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const label = dm ? `${dm[3]}.${dm[2]}.${dm[1].slice(2)}` : d;
  if (it.kind === "tag") {
    const t = (label + " " + (it.session || "")).trim();
    const n = byTitle("Tageszusammenfassungen", x => x === t); if (n) return { type: "note", id: n.id };
    return newNote(t, "Tageszusammenfassungen", d, "day");
  }
  if (it.kind === "trade") {
    const nr = +((key.match(/__(\d+)$/) || [])[1] || 1);
    const ts = S.trades.filter(t => !t.demo && (t.date === d || String(t.openTime || "").slice(0, 10) === d)).sort((a, b) => String(a.openTime).localeCompare(String(b.openTime)));
    if (ts[nr - 1]) return { type: "trade", id: ts[nr - 1].id };
    return newNote(`Trade ${label}${nr > 1 ? " (" + nr + ")" : ""}`, "Trade Notes", d, "day");
  }
  if (it.kind === "woche") { const kw = d.replace("KW", ""); const n = byTitle(null, x => x.replace(/\s+/g, " ") === `KW ${kw} 2026`); if (n) return { type: "note", id: n.id }; return newNote(`KW ${kw} 2026`, "Wochenrückblick", "", "week"); }
  if (it.kind === "monat") { const m = IMG_MONTHS[+d.slice(5, 7) - 1] + " " + d.slice(0, 4); const n = byTitle(null, x => x === m); if (n) return { type: "note", id: n.id }; return newNote(m, "Monatsrückblick", d + "-01", "month"); }
  if (it.kind === "rueckblick") { const n = byTitle(null, x => x.startsWith("Februar bis Juni 2026")); if (n) return { type: "note", id: n.id }; return newNote("Februar bis Juni 2026 – Zusammenfassung", "Monatsrückblick", "2026-06-30", "month"); }
  if (it.kind === "learning") { const st = d.startsWith("Master") ? "Master-Zusammenfassung" : "Wichtige Learnings"; const n = byTitle(null, x => x.startsWith(st)); if (n) return { type: "note", id: n.id }; return newNote(st, "Learnings", "", "custom"); }
  if (it.kind === "kalender") return newNote(`Kalender ${IMG_MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`, "Monatsrückblick", d + "-01", "month");
  return newNote(key, "Sonstiges", "", "custom");
}
async function importImageZip(file) {
  S.busy = "imgzip"; S.imgProg = "Zip wird gelesen …"; render();
  try {
    const z = await readZip(file);
    const mapE = z["bilder-zuordnung.json"]; if (!mapE) throw new Error("bilder-zuordnung.json fehlt in der Zip");
    const map = JSON.parse(await (await zipEntry(mapE)).text());
    const done = new Set(S.settings.imgDone || []);
    const todo = map.filter(it => it.images && it.images.some(n => !done.has(n) && z[n]));
    const total = todo.reduce((s, it) => s + it.images.length, 0); let cnt = 0, fail = 0, made = 0;
    for (const it of todo) {
      const tg = imgTarget(it); if (tg.type === "skip") { it.images.forEach(n => done.add(n)); continue; }
      const ids = [];
      for (const name of it.images) {
        if (done.has(name) || !z[name]) { cnt++; continue; }
        try { const b = await zipEntry(z[name]); ids.push([name, await Store.upload(new File([b], name, { type: "image/jpeg" }))]); done.add(name); }
        catch (e) { fail++; }
        cnt++; S.imgProg = `Bilder ${cnt} / ${total} …`; const lab = document.getElementById("imgzip-lab"); if (lab) lab.textContent = S.imgProg;
      }
      if (!ids.length) continue;
      const imgs = ids.map(([n, id]) => `<img data-shot="${esc(id)}" alt="${esc(n)}"><br>`).join("");
      const block = `<hr><p><b>Seitenbilder aus PDF</b></p>${imgs}`;
      if (tg.type === "trade") { const t = getTrade(tg.id); if (t) await patchTrade(t.id, { shots: [...(t.shots || []), ...ids.map(x => x[1])] }); }
      else if (tg.type === "note") { const n = S.notes.find(x => x.id === tg.id); if (n) await saveDoc("notes", n.id, { ...n, html: noteHTML(n) + block, updated: new Date().toISOString() }); }
      else { const ex = S.notes.find(x => x.id === tg.note.id); const n = ex || tg.note; await saveDoc("notes", n.id, { ...n, html: (ex ? noteHTML(ex) : "<p><i>Seitenbilder aus PDF (Tradezella-Export).</i></p>") + block }); if (!ex) made++; }
      await patchSettings({ imgDone: [...done] });
    }
    await patchSettings({ imgDone: [...done] });
    toast(`${cnt - fail} Bilder eingespielt${made ? `, ${made} neue Notizen` : ""}${fail ? `, ${fail} fehlgeschlagen – Zip einfach nochmal einspielen` : ""}`);
  } catch (e) { toast("Bilder-Import fehlgeschlagen: " + (e.message || e)); }
  S.busy = null; S.imgProg = ""; render();
}

async function restoreBackup(file) {
  S.busy = "restore"; render();
  try {
    const d = JSON.parse(await file.text()); let n = 0;
    if (d.settings) { await saveMany("meta", [{ id: "settings", ...S.settings, ...d.settings }]); n++; }
    if (Array.isArray(d.playbooks)) { await saveMany("playbooks", d.playbooks.filter(p => p.id && p.name)); n += d.playbooks.length; }
    if (Array.isArray(d.trades)) { await saveMany("trades", d.trades.filter(t => t.id && t.date)); n += d.trades.length; }
    if (Array.isArray(d.notes)) { await saveMany("notes", d.notes.filter(x => x.id)); n += d.notes.length; }
    if (d.remove && typeof d.remove === "object") for (const [col, ids] of Object.entries(d.remove)) if (["reports", "notes", "trades", "days", "weeks"].includes(col) && Array.isArray(ids)) { await delMany(col, ids); ids.forEach(id => { if (col === "reports") S.reports = S.reports.filter(r => r.id !== id); if (col === "notes") S.notes = S.notes.filter(r => r.id !== id); }); }
    if (Array.isArray(d.reports)) { await saveMany("reports", d.reports.filter(r => r.id && r.title)); n += d.reports.length; }
    if (typeof d.strategy === "string" && d.strategy.trim()) { await saveMany("meta", [{ id: "strategy", text: d.strategy }]); n++; }
    for (const col of ["days", "weeks"]) if (d[col] && typeof d[col] === "object") { const l = Object.entries(d[col]).map(([id, v]) => ({ id, ...v })); await saveMany(col, l); n += l.length; }
    toast(`${n} Einträge eingespielt`); await loadData(true);
  } catch (e) { toast("Die Datei ist keine gültige Sicherung: " + e.message); }
  S.busy = null; render();
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "loginform") return; e.preventDefault();
  const mail = $("#li-mail").value.trim(), pw = $("#li-pw").value; S.busy = "auth"; S.authMsg = ""; S.authErr = false; render();
  try {
    if (S.authMode === "up") { const direct = await Store.signUp(mail, pw); if (direct) { await Store.session(); S.auth = null; S.busy = null; await loadData(); return; } S.authMsg = "Konto erstellt. Bestätige die E-Mail von Supabase und melde dich dann an."; S.authMode = "in"; }
    else { await Store.signIn(mail, pw); S.auth = null; S.busy = null; await loadData(); return; }
  } catch (err) { S.authErr = true; S.authMsg = /invalid login/i.test(err.message) ? "E-Mail oder Passwort stimmt nicht." : /not confirmed/i.test(err.message) ? "Bitte bestätige zuerst die E-Mail von Supabase." : err.message; }
  S.busy = null; render();
});

/* ========= Init ========= */
let lastLoad = 0;
async function loadData(silent) {
  if (!silent) { S.dbState = "loading"; render(); }
  try { const rows = await Store.loadAll(); applyRows(rows); S.loaded = true; S.dbState = "ok"; lastLoad = Date.now(); }
  catch (e) { S.dbState = "error"; S.err = e.message || String(e); }
  silent ? renderSoft() : render();
  ensureNews();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.loaded && Store.mode === "cloud" && !dirty.size && Date.now() - lastLoad > 60000) loadData(true); });
async function init() {
  route(); S.unit = lsGet("pj-unit") || "eur";
  Store.init();
  if (Store.mode === "cloud") {
    let uid = null; try { uid = await Store.session(); } catch (e) { }
    if (!uid) { S.auth = "login"; render(); return; }
  }
  await loadData();
}
init();
</script>
